name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - name: PowerShell wrapper from README
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\target\debug;$env:PATH"
          cargo new --quiet "$env:RUNNER_TEMP\demo"
          pwsh -NoProfile -File tests\powershell-wrapper.ps1 -Readme README.md -Project "$env:RUNNER_TEMP\demo"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\powershell-wrapper.ps1 -Readme README.md -Project "$env:RUNNER_TEMP\demo"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
