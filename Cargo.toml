[package]
name = "cargo-quota"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Keep cargo's target directory under a disk-space budget by pruning the least recently used build artifacts before each build"
license = "MIT"
repository = "https://github.com/CodingAnarchy/cargo-quota"
readme = "README.md"
keywords = ["cargo", "clean", "target", "disk", "prune"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
serde_json = "1.0.152"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }

[dev-dependencies]
tempfile = "3.27.0"
